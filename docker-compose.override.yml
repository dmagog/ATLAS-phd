# Development overrides — auto-applied by docker compose automatically.
# Mounts source code into the container and enables uvicorn --reload.
# Do NOT commit secrets or use in production.

services:
  # Dev-доступ к Postgres с хоста (psql, DBeaver, миграции вручную).
  # Биндинг на 127.0.0.1, чтобы не светить порт во внешнюю сеть даже на
  # dev-машине разработчика. В production этого override не должно быть —
  # `docker compose -f docker-compose.yml up` без override его не подхватит.
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  embeddings:
    ports:
      - "127.0.0.1:8001:8001"

  app:
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./corpus:/app/corpus
      # Read-only mount for eval results — used by /eval dashboard (Phase 5.2).
      - ./eval:/app/eval:ro
      # Demo seed scripts (Phase 6) — read-only, executed via `docker compose exec`.
      - ./scripts:/app/scripts:ro
    command: uvicorn atlas.api.main:app --host 0.0.0.0 --port 8731 --reload --reload-dir /app/src --timeout-graceful-shutdown 1
    environment:
      APP_ENV: development
